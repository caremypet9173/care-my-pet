# Managed Auth settings for local development using the hosted project.
# Always pass --project-ref lrlnqmciarjvngvquchu to config diff/push.
# Only settings managed by this repository are declared here.
project_id = "care-my-pet"

[auth]
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/pl/auth/callback",
  "http://127.0.0.1:3000/en/auth/callback",
  "http://127.0.0.1:3000/pl/auth/confirm",
  "http://127.0.0.1:3000/en/auth/confirm",
  "http://localhost:3000/pl/auth/callback",
  "http://localhost:3000/en/auth/callback",
  "http://localhost:3000/pl/auth/confirm",
  "http://localhost:3000/en/auth/confirm",
]
minimum_password_length = 12

[auth.email]
enable_confirmations = true

# Supabase CLI loads these variables from the root .env (ignored by Git).
# Configure SMTP before sending any real signup emails.
# Note: `port` must remain a raw integer in config.toml (Supabase CLI parses it as uint16, not env()).
[auth.email.smtp]
enabled = true
host = "env(SUPABASE_AUTH_SMTP_HOST)"
port = 587
user = "env(SUPABASE_AUTH_SMTP_USER)"
pass = "env(SUPABASE_AUTH_SMTP_PASS)"
admin_email = "env(SUPABASE_AUTH_SMTP_ADMIN_EMAIL)"
sender_name = "env(SUPABASE_AUTH_SMTP_SENDER_NAME)"

[auth.email.template.confirmation]
subject = "Care My Pet — potwierdź adres e-mail / confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

# The handler verifies every user JWT with Auth before using the user's RLS client.
[functions.pets]
verify_jwt = false

[functions.medical-reports]
verify_jwt = false

[functions.pet-weight]
verify_jwt = false

[functions.pet-history]
verify_jwt = false

[functions.pet-assistant]
verify_jwt = false

[functions.pet-schedule]
verify_jwt = false

[functions.schedule-notifications]
verify_jwt = false

[functions.pet-share]
verify_jwt = false

[functions.pet-archive]
verify_jwt = false

[functions.household]
verify_jwt = false

[functions.household-recovery]
verify_jwt = false

[functions.pet-medications]
verify_jwt = false



