<html lang="pl">
  <head><meta charset="utf-8"><title>Care My Pet</title></head>
  <body>
    <h1>Care My Pet</h1>
    <p>Potwierdź adres e-mail, aby dokończyć tworzenie konta.</p>
    <p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email">Potwierdź adres e-mail</a></p>

    <div lang="en">
      <p>Confirm your email address to finish creating your account.</p>
      <p><a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&amp;type=email">Confirm your email</a></p>

    </div>
  </body>
